    <!-- Tailwind CSS CDN -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lab: {
                            bg: '#101412',
                            sidebar: '#141A16',
                            card: '#19211D',
                            cardHover: '#202B25',

                            secondary: '#43C9C0',
                            textMain: '#F2F5F3',

                        sans: ['Inter', 'SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']

<body class="bg-[#101412] text-[#F2F5F3] min-h-screen flex flex-col md:flex-row antialiased selection:bg-[#65E6B1] selection:text-[#101412]">

    <!-- Mobile Header -->

            <div>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden"></div>

    <!-- Sidebar / Navigation -->

        <div class="p-5 border-b border-[#2B3931] flex items-center space-x-3">
            <div class="w-11 h-11 rounded-full border border-[#65E6B1]/50 flex items-center justify-center bg-[#101412] shrink-0 p-1 shadow-lg shadow-[#65E6B1]/10 overflow-hidden">
                <img src="icon.png" alt="Logo" class="w-full h-full object-cover rounded-full">
            </div>
            <div>
                <h2 class="font-bold text-base tracking-wider text-white">MINI <span class="text-[#65E6B1]">BIO</span> LAB</h2>

            <a href="#" data-page="experiments" class="nav-link flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-[#9AA9A0] hover:bg-[#19211D] hover:text-[#F2F5F3]">

            <a href="#" data-page="journal" class="nav-link flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-[#9AA9A0] hover:bg-[#19211D] hover:text-[#F2F5F3]">

            <a href="#" data-page="statistics" class="nav-link flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-[#9AA9A0] hover:bg-[#19211D] hover:text-[#F2F5F3]">

                <span>System Online</span>
            </div>

        </div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto max-w-[1440px] mx-auto w-full p-4 md:p-8">

    <!-- Global Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">

    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

                { id: 'inv-1', name: 'Microscope Precision Optic', category: 'Equipment', quantity: 1, unit: 'piece', storageLocation: 'Desk Shelf A', minimumStock: 1, notes: 'Main 40x-1000x compound microscope.', createdAt: '2026-01-10T10:00:00Z', updatedAt: '2026-03-01T12:00:00Z' },
                { id: 'inv-2', name: 'Glass Slides & Cover Slips', category: 'Glassware', quantity: 8, unit: 'pieces', storageLocation: 'Drawer 2', minimumStock: 10, notes: 'Standard 76x26mm microscope slides.', createdAt: '2026-01-12T11:00:00Z', updatedAt: '2026-03-10T14:30:00Z' },
                { id: 'inv-3', name: 'Methylene Blue Stain (1%)', category: 'Reagents', quantity: 50, unit: 'ml', storageLocation: 'Cabinet B', minimumStock: 20, notes: 'Vital stain for animal & plant cell nuclei.', createdAt: '2026-01-15T09:00:00Z', updatedAt: '2026-03-05T16:00:00Z' },
                { id: 'inv-4', name: 'Petri Dishes (Sterile)', category: 'Consumables', quantity: 25, unit: 'pieces', storageLocation: 'Cabinet A', minimumStock: 15, notes: '90mm polystyrene culture dishes.', createdAt: '2026-01-20T14:00:00Z', updatedAt: '2026-02-18T10:00:00Z' },
                { id: 'inv-5', name: 'Safety Goggles & Gloves', category: 'Safety', quantity: 4, unit: 'pairs', storageLocation: 'Safety Hook', minimumStock: 2, notes: 'Personal protective equipment.', createdAt: '2026-01-05T08:00:00Z', updatedAt: '2026-01-05T08:00:00Z' }
            ],

                }
            ],
            samples: [
                {
                    id: 'samp-1',
                    name: 'Allium cepa Epidermis',

                    date: '2026-03-02',
                    origin: 'Red onion fleshy scale inner epidermis',
                    storageLocation: 'Slide Box A - Slot 4',
                    status: 'Stored',
                    relatedExperimentId: 'exp-1',
                    notes: 'Stained with Methylene Blue.',

                {

                    date: '2026-03-05',
                    origin: 'Fresh potato tuber core',
                    storageLocation: 'Slide Box A - Slot 7',
                    status: 'Stored',
                    relatedExperimentId: '',
                    notes: 'Contains prominent leucoplast starch granules.',
                    photoReference: ''
                }
            ],
            journal: [
                {
                    id: 'jour-1',
                    title: 'Successful Plasmolysis Documentation',
                    date: '2026-03-02',
                    tag: 'Observation',
                    relatedExperimentId: 'exp-1',
                    relatedSampleId: 'samp-1',
                    body: 'Today completed the onion epidermal cell plasmolysis experiment. Using 10% NaCl created immediate and striking retraction of the plasma membrane.',
                    photoReference: ''
                },
                {
                    id: 'jour-2',
                    title: 'Low Stock Alert: Glass Slides',
                    date: '2026-03-10',
                    tag: 'Maintenance',
                    relatedExperimentId: '',
                    relatedSampleId: '',
                    body: 'Checked inventory and noticed glass slides are down to 8 pieces remaining. Need to order a replacement box.',
                    photoReference: ''
                }
            ],
            activities: [
                { id: 'act-1', description: 'Journal entry saved: "Successful Plasmolysis Documentation"', timestamp: '2026-03-02 16:45', relatedEntityType: 'journal', relatedEntityId: 'jour-1' },
                { id: 'act-2', description: 'Experiment completed: "Onion Epidermal Cell Plasmolysis"', timestamp: '2026-03-02 16:30', relatedEntityType: 'experiment', relatedEntityId: 'exp-1' }
            ]
        };

        let db = JSON.parse(localStorage.getItem('minibiolab_db')) || DEFAULT_DATA;
        function saveDB() {
            localStorage.setItem('minibiolab_db', JSON.stringify(db));
        }

        let currentPage = 'overview';
        let inventoryFilterCat = 'All';
        let inventorySearchQuery = '';
        let sampleFilterType = 'All';
        let sampleSearchQuery = '';
        let journalFilterTag = 'All';
        let journalSearchQuery = '';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-sm flex items-center space-x-3 transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-[#19211D] border-[#65E6B1]/40 text-[#F2F5F3]' : type === 'warning' ? 'bg-[#19211D] border-[#F2B86C]/40 text-[#F2B86C]' : 'bg-[#19211D] border-[#FF7777]/40 text-[#FF7777]'
            }`;
            const iconName = type === 'success' ? 'check-circle' : type === 'warning' ? 'alert-triangle' : 'x-circle';
            const iconColor = type === 'success' ? 'text-[#65E6B1]' : type === 'warning' ? 'text-[#F2B86C]' : 'text-[#FF7777]';
            toast.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 ${iconColor} shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function logActivity(description, type, id) {
            const now = new Date();
            const timestamp = now.toISOString().slice(0, 16).replace('T', ' ');
            db.activities.unshift({ id: 'act-' + Date.now(), description, timestamp, relatedEntityType: type, relatedEntityId: id });
            if (db.activities.length > 20) db.activities.pop();
            saveDB();
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-link').forEach(el => {
                if (el.dataset.page === page) {
                    el.className = 'nav-link flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-colors bg-[#26362D] text-[#65E6B1]';
                } else {
                    el.className = 'nav-link flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-[#9AA9A0] hover:bg-[#19211D] hover:text-[#F2F5F3]';
                }
            });
            renderPage();
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navigateTo(link.dataset.page);
            });
        });

        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        });

        document.getElementById('sidebar-overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        });

        function renderPage() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            switch(currentPage) {
                case 'overview': renderOverview(container); break;
                case 'inventory': renderInventory(container); break;
                case 'experiments': renderExperiments(container); break;
                case 'samples': renderSamples(container); break;
                case 'journal': renderJournal(container); break;
                case 'statistics': renderStatistics(container); break;
                default: renderOverview(container);
            }
            lucide.createIcons();
        }

        function renderOverview(container) {
            const totalInventory = db.inventory.reduce((sum, item) => sum + item.quantity, 0);
            const totalExperiments = db.experiments.length;
            const totalSamples = db.samples.length;
            const totalJournal = db.journal.length;
            const lowStockItems = db.inventory.filter(item => item.quantity <= item.minimumStock);

            container.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 pb-4 border-b border-[#2B3931] gap-4">

                        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Overview</h1>
                        <p class="text-[#9AA9A0] text-sm mt-1">Your laboratory at a glance.</p>
                    </div>
                    <div>

                        </button>

                </div>

                            <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider">Inventory Items</span>
                            <div class="p-2 rounded-xl bg-[#141A16] text-[#65E6B1] group-hover:bg-[#26362D] transition-colors"><i data-lucide="package" class="w-5 h-5"></i></div>
                        </div>
                        <div class="text-3xl font-bold text-white">${db.inventory.length} <span class="text-xs text-[#718077] font-normal">types (${totalInventory} units)</span></div>
                    </div>
                    <div onclick="navigateTo('experiments')" class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5 hover:border-[#65E6B1]/50 transition-all cursor-pointer group">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider">Experiments</span>
                            <div class="p-2 rounded-xl bg-[#141A16] text-[#65E6B1] group-hover:bg-[#26362D] transition-colors"><i data-lucide="flask-conical" class="w-5 h-5"></i></div>
                        </div>
                        <div class="text-3xl font-bold text-white">${totalExperiments}</div>
                    </div>
                    <div onclick="navigateTo('samples')" class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5 hover:border-[#65E6B1]/50 transition-all cursor-pointer group">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider">Samples & Slides</span>
                            <div class="p-2 rounded-xl bg-[#141A16] text-[#65E6B1] group-hover:bg-[#26362D] transition-colors"><i data-lucide="microscope" class="w-5 h-5"></i></div>
                        </div>
                        <div class="text-3xl font-bold text-white">${totalSamples}</div>
                    </div>
                    <div onclick="navigateTo('journal')" class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5 hover:border-[#65E6B1]/50 transition-all cursor-pointer group">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider">Journal Entries</span>
                            <div class="p-2 rounded-xl bg-[#141A16] text-[#65E6B1] group-hover:bg-[#26362D] transition-colors"><i data-lucide="book-open" class="w-5 h-5"></i></div>
                        </div>
                        <div class="text-3xl font-bold text-white">${totalJournal}</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-6 lg:col-span-2 flex flex-col justify-between">
                        <div>
                            <h2 class="text-lg font-semibold text-white mb-4 flex items-center"><i data-lucide="zap" class="w-5 h-5 mr-2 text-[#65E6B1]"></i> Quick Actions</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <button onclick="openInventoryModal()" class="p-4 rounded-xl bg-[#141A16] border border-[#2B3931] hover:border-[#65E6B1] hover:bg-[#202B25] transition-all text-center flex flex-col items-center justify-center group">
                                    <div class="w-10 h-10 rounded-full bg-[#26362D] flex items-center justify-center text-[#65E6B1] mb-2 group-hover:scale-110 transition-transform"><i data-lucide="package-plus" class="w-5 h-5"></i></div>

                                    <span class="text-xs font-medium text-[#F2F5F3]">New Experiment</span>
                                </button>
                                <button onclick="openSampleModal()" class="p-4 rounded-xl bg-[#141A16] border border-[#2B3931] hover:border-[#65E6B1] hover:bg-[#202B25] transition-all text-center flex flex-col items-center justify-center group">

                        <input type="text" id="journal-search" value="${journalSearchQuery}" oninput="handleJournalSearch(this.value)" placeholder="Search journal entries..." class="w-full bg-[#19211D] border border-[#2B3931] rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-[#718077] focus:outline-none focus:border-[#65E6B1] transition-colors">
                    </div>
                    <div class="flex items-center space-x-2 overflow-x-auto pb-2 md:pb-0">
                        ${['All', 'Observation', 'Result', 'Problem', 'Idea', 'Maintenance', 'General'].map(tag => `
                            <button onclick="setJournalTag('${tag}')" class="px-4 py-2.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${journalFilterTag === tag ? 'bg-[#65E6B1] text-[#101412] font-semibold' : 'bg-[#19211D] border border-[#2B3931] text-[#9AA9A0] hover:text-white'}">

                        `).join('')}

                <div class="space-y-4">

                            <div class="space-y-2 flex-1">
                                <div class="flex items-center space-x-3">
                                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#65E6B1]/10 text-[#65E6B1] border border-[#65E6B1]/30">${entry.tag}</span>
                                    <span class="text-xs text-[#718077]">${entry.date}</span>
                                </div>
                                <h3 class="text-lg font-semibold text-white">${entry.title}</h3>
                                <p class="text-sm text-[#9AA9A0] leading-relaxed whitespace-pre-wrap">${entry.body}</p>

                            <div class="flex items-center space-x-2 pt-3 md:pt-0 border-t md:border-t-0 border-[#2B3931]">
                                <button onclick="openEditJournalModal('${entry.id}')" class="p-2 rounded-xl bg-[#141A16] border border-[#2B3931] text-[#9AA9A0] hover:text-white transition-colors" title="Edit"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deleteJournal('${entry.id}')" class="p-2 rounded-xl bg-[#141A16] border border-[#2B3931] text-[#FF7777] hover:bg-[#FF7777]/10 transition-colors" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                        </div>
                    `).join('') : `
                        <div class="text-center py-12 bg-[#19211D] border border-[#2B3931] rounded-2xl">
                            <i data-lucide="book-open" class="w-12 h-12 text-[#718077] mx-auto mb-3"></i>
                            <p class="text-sm font-medium text-[#F2F5F3]">No journal entries found.</p>

        function setJournalTag(tag) {
            journalFilterTag = tag;
            renderPage();
        }

        function handleJournalSearch(val) {
            journalSearchQuery = val;
            renderPage();
            const input = document.getElementById('journal-search');
            if(input) {
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
        }

        function deleteJournal(id) {
            const entry = db.journal.find(j => j.id === id);
            if (!entry) return;
            openConfirmModal(`Delete “${entry.title}”?`, 'This action cannot be undone.', () => {
                db.journal = db.journal.filter(j => j.id !== id);
                saveDB();
                logActivity(`Journal entry deleted: ${entry.title}`, 'journal', id);
                showToast(`Deleted journal entry ${entry.title}`, 'error');
                renderPage();
            });
        }

        function renderStatistics(container) {
            const totalExp = db.experiments.length;
            const completedExp = db.experiments.filter(e => e.status === 'Completed').length;
            const completionRate = totalExp > 0 ? Math.round((completedExp / totalExp) * 100) : 0;
            const totalSamples = db.samples.length;
            const totalJournal = db.journal.length;

            const categories = ['Equipment', 'Glassware', 'Consumables', 'Reagents', 'Safety', 'Other'];
            const catCounts = categories.map(cat => ({
                name: cat,
                count: db.inventory.filter(i => i.category === cat).reduce((sum, i) => sum + i.quantity, 0)
            }));
            const maxCatCount = Math.max(...catCounts.map(c => c.count), 1);

            const statuses = ['Planned', 'In Progress', 'Completed', 'Archived'];
            const statusCounts = statuses.map(st => ({
                status: st,
                count: db.experiments.filter(e => e.status === st).length
            }));
            const maxStatusCount = Math.max(...statusCounts.map(s => s.count), 1);

            container.innerHTML = `
                <div class="mb-8 pb-4 border-b border-[#2B3931]">
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Statistics</h1>
                    <p class="text-[#9AA9A0] text-sm mt-1">Visual metrics and laboratory analytics.</p>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5">
                        <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-2">Total Experiments</span>
                        <div class="text-3xl font-bold text-white">${totalExp}</div>
                    </div>
                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5">
                        <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-2">Completion Rate</span>
                        <div class="text-3xl font-bold text-[#65E6B1]">${completionRate}%</div>
                    </div>
                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5">
                        <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-2">Total Samples</span>
                        <div class="text-3xl font-bold text-white">${totalSamples}</div>
                    </div>
                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-5">
                        <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-2">Journal Entries</span>
                        <div class="text-3xl font-bold text-white">${totalJournal}</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-6">
                        <h2 class="text-lg font-semibold text-white mb-6 flex items-center"><i data-lucide="bar-chart-3" class="w-5 h-5 mr-2 text-[#65E6B1]"></i> Inventory by Category (Total Units)</h2>
                        <div class="space-y-4">
                            ${catCounts.map(item => {
                                const percent = Math.round((item.count / maxCatCount) * 100);
                                return `
                                    <div>
                                        <div class="flex justify-between text-xs font-medium mb-1">
                                            <span class="text-[#F2F5F3]">${item.name}</span>
                                            <span class="text-[#9AA9A0]">${item.count} units</span>
                                        </div>
                                        <div class="w-full bg-[#141A16] rounded-full h-3 border border-[#2B3931] overflow-hidden">
                                            <div class="bg-[#65E6B1] h-full rounded-full transition-all duration-500" style="width: ${Math.max(percent, 4)}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-[#19211D] border border-[#2B3931] rounded-2xl p-6">
                        <h2 class="text-lg font-semibold text-white mb-6 flex items-center"><i data-lucide="pie-chart" class="w-5 h-5 mr-2 text-[#65E6B1]"></i> Experiments by Status</h2>
                        <div class="space-y-4">
                            ${statusCounts.map(item => {
                                const percent = Math.round((item.count / maxStatusCount) * 100);
                                return `
                                    <div>
                                        <div class="flex justify-between text-xs font-medium mb-1">
                                            <span class="text-[#F2F5F3]">${item.status}</span>
                                            <span class="text-[#9AA9A0]">${item.count} experiments</span>
                                        </div>
                                        <div class="w-full bg-[#141A16] rounded-full h-3 border border-[#2B3931] overflow-hidden">
                                            <div class="bg-[#43C9C0] h-full rounded-full transition-all duration-500" style="width: ${Math.max(percent, 4)}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openModal(html) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = html;
            container.classList.remove('hidden');

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                    <button onclick="closeModal(); openInventoryModal();" class="p-4 rounded-xl bg-[#141A16] border border-[#2B3931] hover:border-[#65E6B1] text-left group">

                        <h4 class="font-semibold text-white text-sm">Add Sample / Slide</h4>
                        <p class="text-xs text-[#718077] mt-1">Catalog biological specimen or slide.</p>
                    </button>
                    <button onclick="closeModal(); openJournalModal();" class="p-4 rounded-xl bg-[#141A16] border border-[#2B3931] hover:border-[#65E6B1] text-left group">
                        <i data-lucide="notebook-pen" class="w-6 h-6 text-[#65E6B1] mb-2"></i>

            openModal(`
                <div class="text-center py-4">

                onConfirm();

        function openInventoryModal(editId = null) {
            const item = editId ? db.inventory.find(i => i.id === editId) : null;
            openModal(`
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-[#2B3931]">
                    <h3 class="text-lg font-bold text-white">${item ? 'Edit Inventory Item' : 'Add Inventory Item'}</h3>
                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form id="inventory-form" onsubmit="saveInventoryItem(event, '${editId || ''}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Item Name *</label>
                        <input type="text" id="inv-name" required value="${item ? item.name : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Category</label>
                            <select id="inv-cat" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                                ${['Equipment', 'Glassware', 'Consumables', 'Reagents', 'Safety', 'Other'].map(c => `<option value="${c}" ${item && item.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Storage Location</label>
                            <input type="text" id="inv-loc" value="${item ? item.storageLocation : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Quantity</label>
                            <input type="number" id="inv-qty" min="0" required value="${item ? item.quantity : 1}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Unit</label>
                            <input type="text" id="inv-unit" oninput="updateUnitLabel(this.value)" value="${item ? item.unit : 'piece'}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Minimum Stock (<span id="min-unit-label">${item ? item.unit : 'piece'}</span>)</label>
                            <input type="number" id="inv-min" min="0" required value="${item ? item.minimumStock : 2}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Notes</label>
                        <textarea id="inv-notes" rows="3" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${item ? item.notes : ''}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-[#2B3931]">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-[#101412] border border-[#2B3931] text-xs font-semibold text-white">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold hover:bg-[#43C9C0]">Save Item</button>
                    </div>
                </form>
            `);
        }

        function updateUnitLabel(val) {
            const label = document.getElementById('min-unit-label');
            if (label) {
                label.textContent = val.trim() || 'unit';
            }
        }

        function openEditInventoryModal(id) {
            openInventoryModal(id);
        }

        function openViewInventoryModal(id) {
            const item = db.inventory.find(i => i.id === id);
            if(!item) return;
            openModal(`
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-[#2B3931]">
                    <h3 class="text-lg font-bold text-white">${item.name}</h3>
                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-4 text-sm">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[#101412] p-4 rounded-xl border border-[#2B3931]">
                        <div><strong class="text-[#9AA9A0]">Category:</strong> <span class="text-white">${item.category}</span></div>
                        <div><strong class="text-[#9AA9A0]">Location:</strong> <span class="text-white">${item.storageLocation}</span></div>
                        <div><strong class="text-[#9AA9A0]">Quantity:</strong> <span class="text-white">${item.quantity} ${item.unit}</span></div>
                        <div><strong class="text-[#9AA9A0]">Minimum Stock:</strong> <span class="text-white">${item.minimumStock} ${item.unit}</span></div>
                    </div>
                    <div>
                        <h4 class="text-xs font-medium text-[#9AA9A0] mb-1">Notes</h4>
                        <p class="text-white bg-[#101412] p-4 rounded-xl border border-[#2B3931]">${item.notes || 'No notes provided.'}</p>
                    </div>
                    <div class="flex justify-end pt-4 border-t border-[#2B3931]">
                        <button onclick="closeModal(); openEditInventoryModal('${item.id}');" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold">Edit Item</button>
                    </div>
                </div>
            `);
        }

        function saveInventoryItem(e, editId) {
            e.preventDefault();
            const name = document.getElementById('inv-name').value.trim();
            const category = document.getElementById('inv-cat').value;
            const storageLocation = document.getElementById('inv-loc').value.trim();
            const quantity = parseInt(document.getElementById('inv-qty').value) || 0;
            const unit = document.getElementById('inv-unit').value.trim() || 'piece';
            const minimumStock = parseInt(document.getElementById('inv-min').value) || 0;
            const notes = document.getElementById('inv-notes').value.trim();

            if (editId) {
                const item = db.inventory.find(i => i.id === editId);
                if (item) {
                    item.name = name;
                    item.category = category;
                    item.storageLocation = storageLocation;
                    item.quantity = quantity;
                    item.unit = unit;
                    item.minimumStock = minimumStock;
                    item.notes = notes;
                    item.updatedAt = new Date().toISOString();
                    logActivity(`Inventory item updated: ${name}`, 'inventory', editId);
                    showToast(`Updated ${name}`);
                }
            } else {
                const newItem = {
                    id: 'inv-' + Date.now(),
                    name,
                    category,
                    storageLocation,
                    quantity,
                    unit,
                    minimumStock,
                    notes,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                db.inventory.push(newItem);
                logActivity(`Inventory item added: ${name}`, 'inventory', newItem.id);
                showToast(`Added ${name}`);
            }

            saveDB();
            closeModal();
            renderPage();
        }

                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                        </div>
                        <div>

                        <input type="text" id="exp-rq" value="${exp ? exp.researchQuestion : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">

                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Method / Procedure Notes</label>
                        <textarea id="exp-meth" rows="3" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${exp ? exp.method : ''}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Observations</label>
                        <textarea id="exp-obs" rows="3" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${exp ? exp.observations : ''}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Results</label>
                        <textarea id="exp-res" rows="2" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${exp ? exp.results : ''}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Conclusion</label>
                        <textarea id="exp-conc" rows="2" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${exp ? exp.conclusion : ''}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-[#2B3931]">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-[#101412] border border-[#2B3931] text-xs font-semibold text-white">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold hover:bg-[#43C9C0]">Save Experiment</button>
                    </div>
                </form>
            `);
        }

        function openEditExperimentModal(id) {
            openExperimentModal(id);
        }

        function openViewExperimentModal(id) {
            const exp = db.experiments.find(e => e.id === id);
            if(!exp) return;
            openModal(`
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-[#2B3931]">
                    <div>
                        <h3 class="text-lg font-bold text-white">${exp.title}</h3>
                        <p class="text-xs text-[#65E6B1] mt-0.5">${exp.category} · ${exp.date}</p>
                    </div>
                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-4 text-sm max-h-[75vh] overflow-y-auto pr-2">
                    <div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]">
                        <span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Status</span>
                        <span class="text-white font-semibold">${exp.status}</span>
                    </div>
                    ${exp.researchQuestion ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Research Question</span><p class="text-white">${exp.researchQuestion}</p></div>` : ''}
                    ${exp.hypothesis ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Hypothesis</span><p class="text-white">${exp.hypothesis}</p></div>` : ''}
                    ${exp.materials ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Materials</span><p class="text-white whitespace-pre-wrap">${exp.materials}</p></div>` : ''}
                    ${exp.method ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Method / Procedure</span><p class="text-white whitespace-pre-wrap">${exp.method}</p></div>` : ''}
                    ${exp.observations ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Observations</span><p class="text-white whitespace-pre-wrap">${exp.observations}</p></div>` : ''}
                    ${exp.results ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Results</span><p class="text-white whitespace-pre-wrap">${exp.results}</p></div>` : ''}
                    ${exp.conclusion ? `<div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]"><span class="text-xs font-medium text-[#9AA9A0] uppercase tracking-wider block mb-1">Conclusion</span><p class="text-white whitespace-pre-wrap">${exp.conclusion}</p></div>` : ''}
                    <div class="flex justify-end space-x-3 pt-4 border-t border-[#2B3931]">
                        <button onclick="closeModal(); openEditExperimentModal('${exp.id}');" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold">Edit Experiment</button>
                    </div>
                </div>
            `);
        }

        function saveExperiment(e, editId) {
            e.preventDefault();
            const title = document.getElementById('exp-title').value.trim();
            const category = document.getElementById('exp-cat').value.trim();
            const date = document.getElementById('exp-date').value;
            const status = document.getElementById('exp-status').value;
            const researchQuestion = document.getElementById('exp-rq').value.trim();
            const hypothesis = document.getElementById('exp-hyp').value.trim();
            const materials = document.getElementById('exp-mat').value.trim();
            const method = document.getElementById('exp-meth').value.trim();
            const observations = document.getElementById('exp-obs').value.trim();
            const results = document.getElementById('exp-res').value.trim();
            const conclusion = document.getElementById('exp-conc').value.trim();

            if (editId) {
                const exp = db.experiments.find(e => e.id === editId);
                if (exp) {
                    exp.title = title;
                    exp.category = category;
                    exp.date = date;
                    exp.status = status;
                    exp.researchQuestion = researchQuestion;
                    exp.hypothesis = hypothesis;
                    exp.materials = materials;
                    exp.method = method;
                    exp.observations = observations;
                    exp.results = results;
                    exp.conclusion = conclusion;
                    logActivity(`Experiment updated: ${title}`, 'experiment', editId);
                    showToast(`Updated experiment ${title}`);
                }
            } else {
                const newExp = {
                    id: 'exp-' + Date.now(),
                    title,
                    category,
                    date,
                    status,
                    researchQuestion,
                    hypothesis,
                    materials,
                    method,
                    observations,
                    results,
                    conclusion,
                    relatedSampleIds: [],
                    relatedInventoryIds: []
                };
                db.experiments.push(newExp);
                logActivity(`Experiment created: ${title}`, 'experiment', newExp.id);
                showToast(`Created experiment ${title}`);
            }

            saveDB();
            closeModal();
            renderPage();
        }

        function openSampleModal(editId = null) {
            const samp = editId ? db.samples.find(s => s.id === editId) : null;
            openModal(`
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-[#2B3931]">
                    <h3 class="text-lg font-bold text-white">${samp ? 'Edit Sample' : 'Add Sample'}</h3>
                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form id="sample-form" onsubmit="saveSample(event, '${editId || ''}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Sample Name *</label>
                        <input type="text" id="samp-name" required value="${samp ? samp.name : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Sample Type</label>
                            <select id="samp-type" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                                ${['Plant', 'Prepared Slide', 'Food Sample', 'Water Sample', 'Other'].map(t => `<option value="${t}" ${samp && samp.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Status</label>
                            <select id="samp-status" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                                ${['Stored', 'In Use', 'Disposed'].map(s => `<option value="${s}" ${samp && samp.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Date Added</label>
                            <input type="date" id="samp-date" value="${samp ? samp.date : new Date().toISOString().slice(0, 10)}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Storage Location</label>
                            <input type="text" id="samp-loc" value="${samp ? samp.storageLocation : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Origin / Description</label>
                        <input type="text" id="samp-origin" value="${samp ? samp.origin : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Notes & Observations</label>
                        <textarea id="samp-notes" rows="3" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${samp ? samp.notes : ''}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-[#2B3931]">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-[#101412] border border-[#2B3931] text-xs font-semibold text-white">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold hover:bg-[#43C9C0]">Save Sample</button>
                    </div>
                </form>
            `);
        }

        function openEditSampleModal(id) {
            openSampleModal(id);
        }

        function openViewSampleModal(id) {
            const samp = db.samples.find(s => s.id === id);
            if(!samp) return;
            openModal(`
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-[#2B3931]">
                    <h3 class="text-lg font-bold text-white">${samp.name}</h3>
                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-4 text-sm">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[#101412] p-4 rounded-xl border border-[#2B3931]">
                        <div><strong class="text-[#9AA9A0]">Type:</strong> <span class="text-white">${samp.type}</span></div>
                        <div><strong class="text-[#9AA9A0]">Status:</strong> <span class="text-white">${samp.status}</span></div>
                        <div><strong class="text-[#9AA9A0]">Date:</strong> <span class="text-white">${samp.date}</span></div>
                        <div><strong class="text-[#9AA9A0]">Location:</strong> <span class="text-white">${samp.storageLocation}</span></div>
                    </div>
                    <div class="bg-[#101412] p-4 rounded-xl border border-[#2B3931]">
                        <strong class="text-[#9AA9A0] block mb-1">Origin</strong>
                        <p class="text-white">${samp.origin || 'N/A'}</p>
                    </div>
                    <div>
                        <h4 class="text-xs font-medium text-[#9AA9A0] mb-1">Notes</h4>
                        <p class="text-white bg-[#101412] p-4 rounded-xl border border-[#2B3931]">${samp.notes || 'No notes provided.'}</p>
                    </div>
                    <div class="flex justify-end pt-4 border-t border-[#2B3931]">
                        <button onclick="closeModal(); openEditSampleModal('${samp.id}');" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold">Edit Sample</button>
                    </div>
                </div>
            `);
        }

        function saveSample(e, editId) {
            e.preventDefault();
            const name = document.getElementById('samp-name').value.trim();
            const type = document.getElementById('samp-type').value;
            const status = document.getElementById('samp-status').value;
            const date = document.getElementById('samp-date').value;
            const storageLocation = document.getElementById('samp-loc').value.trim();
            const origin = document.getElementById('samp-origin').value.trim();
            const notes = document.getElementById('samp-notes').value.trim();

            if (editId) {
                const samp = db.samples.find(s => s.id === editId);
                if (samp) {
                    samp.name = name;
                    samp.type = type;
                    samp.status = status;
                    samp.date = date;
                    samp.storageLocation = storageLocation;
                    samp.origin = origin;
                    samp.notes = notes;
                    logActivity(`Sample updated: ${name}`, 'sample', editId);
                    showToast(`Updated sample ${name}`);
                }
            } else {
                const newSamp = {
                    id: 'samp-' + Date.now(),
                    name,
                    type,
                    status,
                    date,
                    storageLocation,
                    origin,
                    notes,
                    relatedExperimentId: '',
                    photoReference: ''
                };
                db.samples.push(newSamp);
                logActivity(`Sample cataloged: ${name}`, 'sample', newSamp.id);
                showToast(`Cataloged sample ${name}`);
            }

            saveDB();
            closeModal();
            renderPage();
        }

        function openJournalModal(editId = null) {
            const entry = editId ? db.journal.find(j => j.id === editId) : null;
            openModal(`
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-[#2B3931]">
                    <h3 class="text-lg font-bold text-white">${entry ? 'Edit Journal Entry' : 'New Journal Entry'}</h3>
                    <button onclick="closeModal()" class="text-[#9AA9A0] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form id="journal-form" onsubmit="saveJournalEntry(event, '${editId || ''}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Entry Title *</label>
                        <input type="text" id="jour-title" required value="${entry ? entry.title : ''}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Date</label>
                            <input type="date" id="jour-date" value="${entry ? entry.date : new Date().toISOString().slice(0, 10)}" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Tag</label>
                            <select id="jour-tag" class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">
                                ${['Observation', 'Result', 'Problem', 'Idea', 'Maintenance', 'General'].map(t => `<option value="${t}" ${entry && entry.tag === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#9AA9A0] mb-1">Journal Notes & Observations *</label>
                        <textarea id="jour-body" rows="5" required class="w-full bg-[#101412] border border-[#2B3931] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#65E6B1]">${entry ? entry.body : ''}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-[#2B3931]">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-[#101412] border border-[#2B3931] text-xs font-semibold text-white">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-xl bg-[#65E6B1] text-[#101412] text-xs font-semibold hover:bg-[#43C9C0]">Save Entry</button>
                    </div>
                </form>
            `);
        }

        function openEditJournalModal(id) {
            openJournalModal(id);
        }

        function saveJournalEntry(e, editId) {
            e.preventDefault();
            const title = document.getElementById('jour-title').value.trim();
            const date = document.getElementById('jour-date').value;
            const tag = document.getElementById('jour-tag').value;
            const body = document.getElementById('jour-body').value.trim();

            if (editId) {
                const entry = db.journal.find(j => j.id === editId);
                if (entry) {
                    entry.title = title;
                    entry.date = date;
                    entry.tag = tag;
                    entry.body = body;
                    logActivity(`Journal entry updated: ${title}`, 'journal', editId);
                    showToast(`Updated journal entry ${title}`);
                }
            } else {
                const newEntry = {
                    id: 'jour-' + Date.now(),
                    title,
                    date,
                    tag,
                    relatedExperimentId: '',
                    relatedSampleId: '',
                    body,
                    photoReference: ''
                };
                db.journal.unshift(newEntry);
                logActivity(`Journal entry saved: "${title}"`, 'journal', newEntry.id);
                showToast(`Saved journal entry ${title}`);
            }

            saveDB();
            closeModal();
            renderPage();
        }

        renderPage();
    </script>
</body>
</html>
